[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["David Rios <david.rios.gomes@gmail.com>"]
repository = "https://github.com/Roboport-Tecnologia/mitsuami"

[workspace.dependencies]
mitsuami = { path = "crates/mitsuami", version = "=0.0.1" }
mitsuami-reactive = { path = "crates/mitsuami-reactive", version = "=0.0.1" }
mitsuami-core = { path = "crates/mitsuami-core", version = "=0.0.1" }
mitsuami-widgets = { path = "crates/mitsuami-widgets", version = "=0.0.1" }
mitsuami-headless = { path = "crates/mitsuami-headless", version = "=0.0.1" }
mitsuami-test = { path = "crates/mitsuami-test", version = "=0.0.1" }
mitsuami-test-macros = { path = "crates/mitsuami-test-macros", version = "=0.0.1" }
mitsuami-macros = { path = "crates/mitsuami-macros", version = "=0.0.1" }
mitsuami-appkit = { path = "crates/mitsuami-appkit", version = "=0.0.1" }
mitsuami-gtk = { path = "crates/mitsuami-gtk", version = "=0.0.1" }
mitsuami-winui = { path = "crates/mitsuami-winui", version = "=0.0.1" }

slotmap = "1.1"
taffy = "0.14"
inventory = "0.3"
similar = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
png = "0.18"

objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"

# GTK 4.10 is the floor (docs/ARCHITECTURE.md §11).
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
libc = "0.2"

windows-core = "0.100"
windows-link = "0.100"
windows-collections = "0.100"
windows-future = "0.100"
windows-reference = "0.100"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
