name: Test

# Runs when started by hand (`gh workflow run test.yml --ref <branch>`), and
# from the release workflow on tags. Not on ordinary pushes.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      headless_only:
        description: Skip the native backend tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned, so native rendering only changes when we move images.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # GTK 4 headers to build, gtk4-broadwayd for the native tests' private display.
      - name: Install GTK 4
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgtk-4-bin

      # The WinUI backend needs the Windows App Runtime 2.4+ installed, even
      # headless: its services tests always use the real services.
      - name: Install the Windows App Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe -OutFile $env:RUNNER_TEMP\appruntime.exe
          & $env:RUNNER_TEMP\appruntime.exe --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cargo build --workspace --all-targets

      # Failures are also posted as annotations, so they show on the run's
      # summary page without digging through the log.
      - name: Test (headless)
        shell: bash
        run: .github/scripts/cargo-test.sh headless

      # Native snapshots and visual baselines depend on the machine's fonts,
      # OS version and scale, so they are kept per runner image
      # (tests/{snapshots,visual}/<backend>/<image>/, docs/ARCHITECTURE.md §12).
      - name: Test (native)
        if: ${{ !inputs.headless_only }}
        shell: bash
        run: .github/scripts/cargo-test.sh native
        env:
          MITSUAMI_NATIVE: "1"
          MITSUAMI_IMAGE: ${{ matrix.os }}

      # Missing and changed snapshots, and the diffs, at their paths in the
      # repository. `.github/scripts/accept-snapshots.sh <run id>` accepts them.
      # The archive path is relative: GNU tar reads `D:\…` as a remote host.
      - name: Collect snapshots for review
        if: failure()
        shell: bash
        run: |
          find crates -path '*/tests/*' \( -name '*.new' -o -name '*.new.png' -o -name '*.diff.png' \) -print0 \
            | tar --null -cf snapshots.tar -T -

      - name: Upload snapshots for review
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: snapshots-${{ matrix.os }}
          path: snapshots.tar
          if-no-files-found: ignore

  # The Qt Quick and Kirigami backend (the `kde` feature) on its own:
  # Kirigami 6 isn't packaged for Ubuntu 24.04, so this runs in an Arch Linux
  # container. Arch is rolling, so its native snapshots and baselines
  # (tests/{snapshots,visual}/kirigami/archlinux/) can change with Qt and KDE
  # updates. GTK 4 is there too: the test kit depends on it on Linux.
  kde:
    name: Test (KDE Plasma)
    if: ${{ !inputs.headless_only }}
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Qt, Kirigami, Breeze and GTK 4
        run: |
          pacman -Syu --noconfirm --needed git rustup qt6-declarative kirigami qqc2-desktop-style \
            breeze breeze-icons noto-fonts gtk4

      - uses: actions/checkout@v5

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Test (native, Kirigami)
        shell: bash
        run: |
          .github/scripts/cargo-test.sh kde -p mitsuami -p mitsuami-kirigami \
            --features mitsuami/kde,mitsuami-test/kde,mitsuami-kirigami/qt
        env:
          MITSUAMI_NATIVE: "1"
          MITSUAMI_IMAGE: archlinux

      - name: Collect snapshots for review
        if: failure()
        shell: bash
        run: |
          find crates -path '*/tests/*' \( -name '*.new' -o -name '*.new.png' -o -name '*.diff.png' \) -print0 \
            | tar --null -cf snapshots.tar -T -

      - name: Upload snapshots for review
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: snapshots-archlinux-kde
          path: snapshots.tar
          if-no-files-found: ignore
