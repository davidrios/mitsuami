name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Regenerate the snapshots and visual baselines and upload them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned: visual baselines belong to the image that rendered them
        # (docs/ARCHITECTURE.md §12).
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      MITSUAMI_UPDATE_SNAPSHOTS: ${{ inputs.update_baselines && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # GTK 4 headers to build, gtk4-broadwayd for the native tests' private display.
      - name: Install GTK 4
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgtk-4-bin

      # The WinUI backend needs the Windows App Runtime 2.4+ installed.
      - name: Install the Windows App Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/windowsappsdk/2.5/latest/windowsappruntimeinstall-x64.exe -OutFile $env:RUNNER_TEMP\appruntime.exe
          & $env:RUNNER_TEMP\appruntime.exe --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test (headless)
        run: cargo test --workspace

      - name: Test (native)
        run: cargo test --workspace
        env:
          MITSUAMI_NATIVE: "1"

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.os }}
          path: crates/*/tests/visual/**/*.diff.png
          if-no-files-found: ignore

      - name: Upload regenerated baselines
        if: inputs.update_baselines
        uses: actions/upload-artifact@v4
        with:
          name: baselines-${{ matrix.os }}
          path: |
            crates/*/tests/visual/
            crates/*/tests/snapshots/
